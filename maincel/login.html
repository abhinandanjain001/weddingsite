<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="login.css" />
    <title>Login Page | Caged coder</title>
  </head>


<body>
  <!-- id="body" -->

<!-- <video autoplay loop muted playsinline id="background-video">
    <source src="https://www.videvo.net/videvo_files/converted/2016_10/preview/160918_063_StonesAndSea_1080p.mp430662.mp4" type="video/mp4">
</video> -->

    <div class="container" id="container">
      <div class="form-container sign-up">
        <form id="signupForm" action="javascript:void(0)">
          <h1>Create Account</h1>
          <div class="social-icons">
            <a href="#" class="icon"
              ><i class="fa-brands fa-google-plus-g"></i
            ></a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon"
              ><i class="fa-brands fa-linkedin-in"></i
            ></a>
          </div>
          <span>or use your email for registeration</span>
          <input type="text" placeholder="Name" id="signupName" required />
          <input type="email" placeholder="Email" id="signupEmail" required autocomplete="off"/>
          <input type="password" placeholder="Password" id="signupPassword" required/>
          <button type="submit" >Sign Up</button>
        </form>
      </div>
      <div class="form-container sign-in">
        <form id="loginForm" action="javascript:void(0)">
          <h1>Sign In</h1>
          <div class="social-icons">
            <a href="#" class="icon"
              ><i class="fa-brands fa-google-plus-g"></i
            ></a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon"
              ><i class="fa-brands fa-linkedin-in"></i
            ></a>
          </div>
          <span>or use your email password</span>
          <input type="email" placeholder="Email" id="loginEmail" required />
          <input type="password" placeholder="Password" id="loginPassword" required />
          <a href="#">Forget Your Password?</a>
          <button type="submit">Sign In</button>
        </form>
      </div>
      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <h1>Welcome Back!</h1>
            <p>Enter your personal details to use all of site features</p>
            <button class="hidden" id="login">Sign In</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h1>Hello, Friend!</h1>
            <p>
              Register with your personal details to use all of site features
            </p>
            <button class="hidden" id="register">Sign Up</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        updateProfile
      } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAci80jI766evAaL3JeafoR0k1AtiKPaC4",
        authDomain: "weeding-project-e337c.firebaseapp.com",
        projectId: "weeding-project-e337c",
        storageBucket: "weeding-project-e337c.firebasestorage.app",
        messagingSenderId: "855319099335",
        appId: "1:855319099335:web:4f992b4c2b76e9bc4c8be2",
        measurementId: "G-L3VS65N7FB"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const signupForm = document.getElementById("signupForm");
      const loginForm = document.getElementById("loginForm");

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          if (name) {
            await updateProfile(userCredential.user, { displayName: name });
          }
          alert("Signup successful");
          window.location.href = "index.html";
        } catch (error) {
          alert(error.message);
        }
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);
          alert("Login successful");
          window.location.href = "index.html";
        } catch (error) {
          alert(error.message);
        }
      });
    </script>
  </body>
</html>
