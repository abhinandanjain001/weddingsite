<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="login.css" />
    <title>Login Page | Caged coder</title>
  </head>


<body>
  <a class="back-button" href="javascript:history.back()">Back</a>
  <!-- id="body" -->

<!-- <video autoplay loop muted playsinline id="background-video">
    <source src="https://www.videvo.net/videvo_files/converted/2016_10/preview/160918_063_StonesAndSea_1080p.mp430662.mp4" type="video/mp4">
</video> -->
<!-- <i class="fa-solid fa-backward"></i> -->
    <div class="container" id="container">
      <div class="form-container sign-up">
        <form id="signupForm" action="/signup" method="post">
          <h1>Create Account</h1>
          <div class="social-icons">
            <a href="#" class="icon"
              ><i class="fa-brands fa-google-plus-g"></i
            ></a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon"
              ><i class="fa-brands fa-linkedin-in"></i
            ></a>
          </div>
          <span>or use your email for registeration</span>
          <input type="text" placeholder="Name" id="signupName" name="username" required autocomplete="off" />
          <input type="email" placeholder="Email" id="signupEmail" name="email" required autocomplete="off" />
          <input type="password" placeholder="Password" id="signupPassword" name="password" required />
          <button type="submit" >Sign Up</button>
        </form>
      </div>
      <div class="form-container sign-in">
        <form id="loginForm" action="/login" method="post">
          <h1>Sign In</h1>
          <div class="social-icons">
            <a href="#" class="icon"
              ><i class="fa-brands fa-google-plus-g"></i
            ></a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon"
              ><i class="fa-brands fa-linkedin-in"></i
            ></a>
          </div>
          <span>or use your email password</span>
          <input type="email" placeholder="Email" id="loginEmail" name="username" required autocomplete="off" />
          <input type="password" placeholder="Password" id="loginPassword" name="password" required />
          <a href="#">Forget Your Password?</a>
          <button type="submit">Sign In</button>
        </form>
      </div>
      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <h1>Welcome Back!</h1>
            <p>Enter your personal details to use all of site features</p>
            <button class="hidden" id="login">Sign In</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h1>Hello, Friend!</h1>
            <p>
              Register with your personal details to use all of site features
            </p>
            <button class="hidden" id="register">Sign Up</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
